
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101c35">
<title>Literki na pełnym gazie 4.0</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 min-height:100vh;
 font-family:Arial,sans-serif;
 color:#fff;
 text-align:center;
 background:
 radial-gradient(ellipse at top,#284d81,#101c35 65%);
}
main{
 max-width:560px;
 margin:auto;
 padding:14px 15px 35px;
}
h1{
 color:#ffd344;
 font-size:clamp(23px,6vw,32px);
 margin:12px 0;
 text-shadow:2px 3px #0008;
}
.subtitle{
 color:#c5d7ed;
 font-size:14px;
 margin:5px;
}
.track{
 background:repeating-linear-gradient(
 90deg,#fff 0 20px,#18243b 20px 40px);
 height:13px;
 border-radius:8px;
 margin:15px 0;
}
.hud{
 display:flex;
 justify-content:space-between;
 align-items:center;
 font-size:17px;
 font-weight:bold;
 margin:12px 0;
}
.progress{
 height:17px;
 background:#344766;
 border-radius:20px;
 overflow:hidden;
 margin-bottom:15px;
}
#bar{
 width:0%;
 height:100%;
 background:linear-gradient(90deg,#ff9b24,#ffda44);
 transition:width .4s;
}
.stage{
 background:linear-gradient(160deg,#263c5c,#17243b);
 border:2px solid #456187;
 border-radius:25px;
 padding:18px 12px 22px;
 box-shadow:0 10px 30px #0006;
}
#car{
 display:block;
 width:100%;
 height:210px;
 object-fit:contain;
 margin:0 auto;
 border-radius:15px;
}
#message{
 font-size:clamp(20px,5vw,27px);
 font-weight:bold;
 color:#ffe16b;
 min-height:65px;
 margin:15px 0 8px;
}
#choices{
 display:grid;
 grid-template-columns:repeat(3,minmax(0,1fr));
 gap:10px;
 margin:20px 0;
}
.choice{
 height:115px;
 border:3px solid #80b9ff;
 border-radius:22px;
 background:linear-gradient(150deg,#398ef3,#1755b0);
 color:white;
 font-size:clamp(48px,15vw,74px);
 font-weight:900;
 box-shadow:0 6px #103b79;
 cursor:pointer;
 touch-action:manipulation;
}
.choice:active{
 transform:translateY(4px);
 box-shadow:0 2px #103b79;
}
.choice.correct{
 background:#219e50;
 border-color:#8affad;
}
.choice.wrong{
 background:#c93232;
 border-color:#ff9797;
}
button{
 border:0;
 border-radius:18px;
 padding:16px 20px;
 font-size:19px;
 font-weight:bold;
 cursor:pointer;
 color:white;
 touch-action:manipulation;
}
button:disabled{opacity:.45}
#repeat{
 background:#346cbb;
 width:100%;
 max-width:330px;
 margin:8px auto;
}
#start{
 background:linear-gradient(180deg,#ffbf31,#ef7920);
 color:#27251f;
 width:100%;
 max-width:330px;
 margin:12px auto;
 box-shadow:0 5px #9a4a13;
}
.settings{
 margin:18px 0 5px;
 font-size:15px;
 color:#c5d7ed;
}
select{
 background:#30496d;
 color:white;
 border:1px solid #7188aa;
 border-radius:12px;
 padding:10px;
 font-size:16px;
}
#finish{
 display:none;
 padding:20px 5px;
}
#finish h2{
 font-size:34px;
 color:#ffd344;
}
#finish p{
 font-size:21px;
}
.trophy{
 font-size:65px;
 margin:12px;
}
.small{
 color:#a9bed9;
 font-size:12px;
 margin-top:20px;
}
</style>
</head>
<body>
<main>
<h1>🏁 LITERKI NA PEŁNYM GAZIE!</h1>
<p class="subtitle">Wyścig po 10 literek</p>
<div class="track"></div>

<div class="hud">
 <span id="counter">🏎️ 0 / 10</span>
 <span id="mistakes">⭐ Pomyłki: 0</span>
</div>
<div class="progress"><div id="bar"></div></div>

<div class="stage">
 <div id="game">
  <img id="car" src="mater.jpg" alt="Złomek">
  <div id="message">Gotowy na wyścig?</div>
  <div id="choices"></div>
  <button id="repeat" onclick="speakQuestion()">
   🔊 POSŁUCHAJ PONOWNIE
  </button>
  <button id="start" onclick="startGame()">
   🏁 START WYŚCIGU!
  </button>
  <div class="settings">
   <label for="letterMode">Literki:</label>
   <select id="letterMode" onchange="changeMode()">
    <option value="upper">WIELKIE</option>
    <option value="lower">małe</option>
   </select>
  </div>
 </div>

 <div id="finish">
  <div class="trophy">🏆</div>
  <h2>META!</h2>
  <img src="mcqueen.jpg"
   alt="Zygzak McQueen"
   style="width:100%;height:220px;object-fit:contain">
  <p id="summary"></p>
  <button id="startAgain" onclick="startGame()">
   🏎️ NOWY WYŚCIG
  </button>
 </div>
</div>
<p class="small">Posłuchaj i wskaż właściwą literkę!</p>
</main>

<script>
const alphabet=[
 ["A","a"],["B","be"],["C","ce"],
 ["D","de"],["E","e"],["F","ef"],
 ["G","gie"],["H","ha"],["I","i"],
 ["J","jot"],["K","ka"],["L","el"],
 ["M","em"],["N","en"],["O","o"],
 ["P","pe"],["R","er"],["S","es"],
 ["T","te"],["U","u"],["W","wu"],
 ["Y","igrek"],["Z","zet"]
];

const GOAL=10;
let current=null;
let completed=0;
let mistakes=0;
let playing=false;
let locked=false;
let timer=null;
let round=0;
let voice=null;
let speechToken=0;
let utterance=null;
let remaining=[];

const synth=window.speechSynthesis;
const car=document.getElementById("car");
const message=document.getElementById("message");
const choices=document.getElementById("choices");
const repeat=document.getElementById("repeat");
const start=document.getElementById("start");
const mode=document.getElementById("letterMode");

repeat.disabled=true;

function loadVoices(){
 if(!synth)return;
 const voices=synth.getVoices();
 const polish=voices.filter(v=>
   v.lang.toLowerCase().startsWith("pl")
 );
 voice=polish.find(v=>/google/i.test(v.name))
   ||polish.find(v=>v.localService)
   ||polish[0]||null;
}
loadVoices();
if(synth){
 synth.onvoiceschanged=loadVoices;
}

function stopSpeech(){
 speechToken++;
 if(synth)synth.cancel();
 utterance=null;
}

function speak(text,kind="mater"){
 if(!synth)return;
 stopSpeech();
 const token=speechToken;
 const u=new SpeechSynthesisUtterance(text);
 u.lang="pl-PL";
 if(voice)u.voice=voice;
 u.rate=kind==="mater" ? 0.82 : 1.05;
 u.pitch=kind==="mater" ? 0.78 : 1.15;
 u.volume=1;
 utterance=u;
 u.onend=()=>{
  if(token===speechToken)utterance=null;
 };
 u.onerror=u.onend;
 synth.speak(u);
}

function shuffle(a){
 const result=[...a];
 for(let i=result.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [result[i],result[j]]=[result[j],result[i]];
 }
 return result;
}

function updateHud(){
 document.getElementById("counter").textContent=
  "🏎️ "+completed+" / "+GOAL;
 document.getElementById("mistakes").textContent=
  "⭐ Pomyłki: "+mistakes;
 document.getElementById("bar").style.width=
  (completed/GOAL*100)+"%";
}

function startGame(){
 clearTimeout(timer);
 stopSpeech();
 completed=0;
 mistakes=0;
 current=null;
 remaining=shuffle(alphabet);
 playing=true;
 locked=false;
 document.getElementById("finish").style.display="none";
 document.getElementById("game").style.display="block";
 start.style.display="none";
 repeat.disabled=false;
 updateHud();
 nextRound();
}

function changeMode(){
 if(playing){
  clearTimeout(timer);
  stopSpeech();
  renderChoices();
  speakQuestion();
 }
}

function nextRound(){
 clearTimeout(timer);
 stopSpeech();
 if(!playing)return;
 if(completed>=GOAL){
  finishGame();
  return;
 }
 round++;
 locked=false;
 repeat.disabled=false;
 car.src="mater.jpg";
 message.textContent="Posłuchaj Złomka!";

 if(remaining.length===0){
  remaining=shuffle(alphabet);
 }
 current=remaining.pop();
 renderChoices();

 // Krótka pauza przed pytaniem
 const id=round;
 timer=setTimeout(()=>{
  if(playing && !locked && round===id){
   speakQuestion();
  }
 },350);
}

function renderChoices(){
 choices.innerHTML="";
 if(!current)return;
 const others=shuffle(
  alphabet.filter(x=>x[0]!==current[0])
 ).slice(0,2);
 const options=shuffle([current,...others]);

 options.forEach(item=>{
  const b=document.createElement("button");
  b.className="choice";
  b.textContent=mode.value==="upper"
   ?item[0]:item[0].toLowerCase();
  b.setAttribute("aria-label","Litera "+item[1]);
  b.onclick=()=>checkAnswer(item,b);
  choices.appendChild(b);
 });
}

function speakQuestion(){
 if(!playing || locked || !current)return;
 speak("Znajdź literkę "+current[1],"mater");
}

function checkAnswer(item,button){
 if(!playing || locked)return;
 if(item[0]===current[0]){
  correctAnswer(button);
 }else{
  wrongAnswer(button);
 }
}

function correctAnswer(button){
 locked=true;
 repeat.disabled=true;
 clearTimeout(timer);
 button.classList.add("correct");
 completed++;
 updateHud();
 car.src="mcqueen.jpg";
 message.textContent="🏆 Dajesz czadu!";
 speak("Dajesz czadu!","mcqueen");

 const id=round;
 timer=setTimeout(()=>{
  if(id===round){
   if(completed>=GOAL)finishGame();
   else nextRound();
  }
 },2500);
}

function wrongAnswer(button){
 locked=true;
 repeat.disabled=true;
 clearTimeout(timer);
 mistakes++;
 updateHud();
 button.classList.add("wrong");
 car.src="mater.jpg";
 message.textContent="Siwy dym, pomyłka!";
 speak("Siwy dym, pomyłka!","mater");

 const id=round;
 timer=setTimeout(()=>{
  if(id!==round || !playing)return;
  button.classList.remove("wrong");
  message.textContent="Spróbuj jeszcze raz!";
  locked=false;
  repeat.disabled=false;
 },2200);
}

function finishGame(){
 if(!playing)return;
 clearTimeout(timer);
 stopSpeech();
 playing=false;
 locked=true;
 document.getElementById("game").style.display="none";
 document.getElementById("finish").style.display="block";
 document.getElementById("summary").textContent=
  "Brawo! Rozpoznano 10 literek! Pomyłki: "+mistakes;
 speak("Dajesz czadu! Dotarłeś do mety! Brawo!","mcqueen");
}
</script>
</body>
</html>
