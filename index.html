
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1">
<title>Literki na pełnym gazie 3.0</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  text-align: center;
  color: #26334b;
  background: linear-gradient(160deg,#8bd7ff,#fff0a0);
}

main {
  max-width: 550px;
  margin: auto;
  padding: 15px;
}

h1 {
  font-size: 25px;
  margin: 12px 0;
}

.panel {
  background: white;
  border-radius: 25px;
  padding: 18px;
  box-shadow: 0 6px 18px #0002;
}

#score {
  font-size: 21px;
  margin: 12px;
  font-weight: bold;
}

#car {
  width: 100%;
  height: 185px;
  object-fit: contain;
  border-radius: 15px;
}

#message {
  font-size: 23px;
  font-weight: bold;
  min-height: 58px;
  margin: 15px 0;
}

#choices {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 10px;
  margin: 20px 0;
}

.choice {
  height: 110px;
  border: 3px solid #ddd;
  border-radius: 20px;
  background: #f5f8ff;
  color: #26334b;
  font-size: 65px;
  font-weight: bold;
  cursor: pointer;
}

.choice:active {
  transform: scale(.96);
}

.choice.correct {
  background: #b7f7c7;
  border-color: #229c48;
}

.choice.wrong {
  background: #ffd2d2;
  border-color: #e33b3b;
}

button {
  border: none;
  border-radius: 17px;
  padding: 15px 18px;
  font-size: 18px;
  font-weight: bold;
  margin: 5px;
  cursor: pointer;
  color: white;
  background: #e92c2c;
}

#repeat {
  background: #2675d9;
}

#start {
  background: #25864b;
}

.settings {
  margin: 12px 0;
  font-size: 16px;
}

select {
  font-size: 17px;
  padding: 8px;
  border-radius: 10px;
}

.small {
  font-size: 13px;
  color: #555;
}
</style>
</head>

<body>
<main>

<h1>🏁 Literki na pełnym gazie! 🏎️</h1>

<div id="score">⭐ Punkty: 0</div>

<div class="panel">

<img id="car" src="mater.jpg" alt="Złomek">

<div id="message">
  Gotowy na wyścig z literkami?
</div>

<div id="choices"></div>

<button id="repeat" onclick="speakQuestion()">
  🔊 Posłuchaj ponownie
</button>

<button id="start" onclick="startGame()">
  🏁 Start
</button>

<div class="settings">
  <label for="letterMode">Rodzaj liter:</label>
  <select id="letterMode" onchange="changeMode()">
    <option value="upper">WIELKIE</option>
    <option value="lower">małe</option>
  </select>
</div>

</div>

<p class="small">
  Posłuchaj Złomka i wybierz właściwą literkę!
</p>

</main>

<script>

const alphabet = [
  ["A","a"],["B","be"],["C","ce"],
  ["D","de"],["E","e"],["F","ef"],
  ["G","gie"],["H","ha"],["I","i"],
  ["J","jot"],["K","ka"],["L","el"],
  ["M","em"],["N","en"],["O","o"],
  ["P","pe"],["R","er"],["S","es"],
  ["T","te"],["U","u"],["W","wu"],
  ["Y","igrek"],["Z","zet"]
];

let current = null;
let score = 0;
let playing = false;
let locked = false;
let timer = null;
let round = 0;

const car = document.getElementById("car");
const message = document.getElementById("message");
const choices = document.getElementById("choices");
const start = document.getElementById("start");
const repeat = document.getElementById("repeat");
const letterMode = document.getElementById("letterMode");

repeat.disabled = true;

function speak(text, onEnd) {
  if (!window.speechSynthesis) {
    if(onEnd) onEnd();
    return;
  }

  speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = "pl-PL";
  utterance.rate = 0.85;
  utterance.pitch = 0.75;
  utterance.volume = 1;

  if(onEnd) {
    utterance.onend = onEnd;
    utterance.onerror = onEnd;
  }

  speechSynthesis.speak(utterance);
}

function shuffle(array) {
  return [...array].sort(() => Math.random() - 0.5);
}

function startGame() {
  score = 0;
  round = 0;
  playing = true;
  document.getElementById("score").textContent =
    "⭐ Punkty: 0";
  start.style.display = "none";
  repeat.disabled = false;
  nextRound();
}

function changeMode() {
  if(playing) {
    clearTimeout(timer);
    speechSynthesis.cancel();
    nextRound();
  }
}

function nextRound() {
  clearTimeout(timer);
  round++;
  locked = false;

  car.src = "mater.jpg";
  message.textContent = "Posłuchaj Złomka!";
  choices.innerHTML = "";

  let available = alphabet.filter(
    item => !current || item[0] !== current[0]
  );

  current = available[
    Math.floor(Math.random() * available.length)
  ];

  let others = shuffle(
    alphabet.filter(item => item[0] !== current[0])
  ).slice(0,2);

  let options = shuffle([current,...others]);

  options.forEach(item => {
    const button = document.createElement("button");
    button.className = "choice";
    button.textContent =
      letterMode.value === "upper"
      ? item[0]
      : item[0].toLowerCase();

    button.onclick = () => checkAnswer(item,button);
    choices.appendChild(button);
  });

  speakQuestion();
}

function speakQuestion() {
  if(!playing || locked) return;

  speak("Znajdź literkę " + current[1]);
}

function checkAnswer(item,button) {
  if(locked || !playing) return;

  if(item[0] === current[0]) {
    correctAnswer(button);
  } else {
    wrongAnswer(button);
  }
}

function correctAnswer(button) {
  locked = true;
  speechSynthesis.cancel();

  button.classList.add("correct");

  score++;
  document.getElementById("score").textContent =
    "⭐ Punkty: " + score;

  car.src = "mcqueen.jpg";
  message.textContent = "Dajesz czadu! 🏆";

  const thisRound = round;

  speak("Dajesz czadu!");

  timer = setTimeout(() => {
    if(round === thisRound) nextRound();
  },2600);
}

function wrongAnswer(button) {
  locked = true;
  speechSynthesis.cancel();

  button.classList.add("wrong");
  car.src = "mater.jpg";
  message.textContent =
    "Siwy dym, pomyłka! Spróbuj jeszcze raz.";

  const thisRound = round;

  speak("Siwy dym, pomyłka!");

  timer = setTimeout(() => {
    if(round !== thisRound) return;

    button.classList.remove("wrong");
    message.textContent = "Spróbuj jeszcze raz!";
    locked = false;
  },1900);
}

</script>
</body>
</html>
