
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Literki na pełnym gazie!</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  text-align: center;
  background: linear-gradient(160deg,#8bd7ff,#fff0a0);
  color: #26334b;
}
main {
  max-width: 550px;
  margin: auto;
  padding: 16px;
}
h1 { font-size: 26px; }
.panel {
  background: white;
  border-radius: 25px;
  padding: 20px;
  box-shadow: 0 6px 18px #0002;
}
#letter {
  font-size: clamp(130px,45vw,210px);
  font-weight: bold;
  color: #ed2929;
  line-height: 1.2;
}
#car {
  width: 100%;
  height: 220px;
  object-fit: contain;
  display: none;
  border-radius: 15px;
  margin: 10px auto;
}
#message {
  font-size: 24px;
  font-weight: bold;
  min-height: 65px;
  margin: 15px 0;
}
button {
  border: none;
  border-radius: 18px;
  padding: 17px 20px;
  font-size: 20px;
  font-weight: bold;
  margin: 6px;
  background: #ed2929;
  color: white;
}
button:disabled { opacity: .5; }
#next { background: #25864b; }
#score { font-size: 21px; margin: 15px; }
.small { font-size: 13px; color: #555; }
</style>
</head>
<body>
<main>
<h1>🏁 Literki na pełnym gazie! 🏎️</h1>
<div id="score">⭐ Punkty: 0</div>
<div class="panel">
  <div id="letter">A</div>
  <img id="car" alt="Samochód z filmu Auta">
  <div id="message">Jaką widzisz literkę?</div>
  <button id="mic" onclick="listen()">🎤 Powiedz literkę</button>
  <button id="next" onclick="nextLetter()">➡️ Następna</button>
</div>
<p class="small">Naciśnij mikrofon i wypowiedz nazwę litery.</p>
</main>

<script>
const letters = [
"A","B","C","D","E","F","G","H","I","J",
"K","L","M","N","O","P","R","S","T","U",
"W","Y","Z"
];

const names = {
A:["a"], B:["be","b"], C:["ce","c"],
D:["de","d"], E:["e"], F:["ef","f"],
G:["gie","ge","g"], H:["ha","h"],
I:["i"], J:["jot","j"], K:["ka","k"],
L:["el","l"], M:["em","m"], N:["en","n"],
O:["o"], P:["pe","p"], R:["er","r"],
S:["es","s"], T:["te","t"], U:["u"],
W:["wu","w"], Y:["igrek","y"],
Z:["zet","z"]
};

let current = "A";
let score = 0;
let busy = false;
let round = 0;

const Recognition =
window.SpeechRecognition || window.webkitSpeechRecognition;

const mic = document.getElementById("mic");
const message = document.getElementById("message");
const car = document.getElementById("car");
const letter = document.getElementById("letter");

function say(text) {
  if (!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const voice = new SpeechSynthesisUtterance(text);
  voice.lang = "pl-PL";
  voice.rate = 0.9;
  voice.pitch = 1.15;
  speechSynthesis.speak(voice);
}

function nextLetter() {
  round++;
  busy = false;
  mic.disabled = false;
  const available = letters.filter(x => x !== current);
  current = available[Math.floor(Math.random()*available.length)];
  letter.textContent = current;
  letter.style.display = "block";
  car.style.display = "none";
  car.removeAttribute("src");
  message.textContent = "Jaką widzisz literkę?";
}

function normalize(text) {
  return text.toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z]/g,"");
}

function showCar(filename) {
  letter.style.display = "none";
  car.src = filename;
  car.style.display = "block";
}

function correct() {
  score++;
  document.getElementById("score").textContent =
    "⭐ Punkty: " + score;
  showCar("mcqueen.jpg");
  message.textContent = "Dajesz czadu! 🏆";
  mic.disabled = true;
  say("Dajesz czadu!");
  const thisRound = round;
  setTimeout(() => {
    if (round === thisRound) nextLetter();
  }, 2500);
}

function wrong() {
  showCar("mater.jpg");
  message.textContent = "Siwy dym, pomyłka! Spróbuj jeszcze raz.";
  say("Siwy dym, pomyłka!");
}

function listen() {
  if (busy) return;
  if (!Recognition) {
    message.textContent =
      "Ta przeglądarka nie obsługuje rozpoznawania mowy.";
    return;
  }

  const recognition = new Recognition();
  recognition.lang = "pl-PL";
  recognition.interimResults = false;
  recognition.maxAlternatives = 5;
  recognition.continuous = false;

  busy = true;
  mic.disabled = true;
  message.textContent = "🎧 Słucham...";

  recognition.onresult = event => {
    const answers = [];
    for (let i=0; i<event.results[0].length; i++) {
      answers.push(normalize(event.results[0][i].transcript));
    }
    const accepted = names[current].map(normalize);
    if (answers.some(a => accepted.includes(a))) {
      correct();
    } else {
      wrong();
    }
  };

  recognition.onerror = event => {
    if (event.error === "no-speech") {
      message.textContent = "Nie usłyszałem. Spróbuj ponownie!";
    } else if (event.error === "not-allowed") {
      message.textContent = "Zezwól na mikrofon w Chrome.";
    } else {
      message.textContent = "Spróbuj ponownie.";
    }
  };

  recognition.onend = () => {
    busy = false;
    mic.disabled = false;
  };

  try {
    recognition.start();
  } catch(e) {
    busy = false;
    mic.disabled = false;
    message.textContent = "Spróbuj ponownie.";
  }
}

nextLetter();
</script>
</body>
</html>
