
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101c35">
<title>Literki na pełnym gazie 5.0</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 min-height:100vh;
 font-family:Arial,sans-serif;
 color:#fff;
 text-align:center;
 background:radial-gradient(ellipse at top,#284d81,#101c35 65%);
}
main{
 max-width:560px;
 margin:auto;
 padding:14px 15px 35px;
}
h1{
 color:#ffd344;
 font-size:clamp(23px,6vw,32px);
 margin:12px 0;
 text-shadow:2px 3px #0008;
}
.subtitle{color:#c5d7ed;font-size:14px;margin:5px}
.track{
 background:repeating-linear-gradient(
 90deg,#fff 0 20px,#18243b 20px 40px);
 height:13px;
 border-radius:8px;
 margin:15px 0;
}
.hud{
 display:flex;
 justify-content:space-between;
 align-items:center;
 font-size:17px;
 font-weight:bold;
 margin:12px 0;
}
.progress{
 height:17px;
 background:#344766;
 border-radius:20px;
 overflow:hidden;
 margin-bottom:15px;
}
#bar{
 width:0%;
 height:100%;
 background:linear-gradient(90deg,#ff9b24,#ffda44);
 transition:width .4s;
}
.stage{
 background:linear-gradient(160deg,#263c5c,#17243b);
 border:2px solid #456187;
 border-radius:25px;
 padding:18px 12px 22px;
 box-shadow:0 10px 30px #0006;
}
#car{
 display:block;
 width:100%;
 height:210px;
 object-fit:contain;
 margin:0 auto;
 border-radius:15px;
}
#message{
 font-size:clamp(20px,5vw,27px);
 font-weight:bold;
 color:#ffe16b;
 min-height:65px;
 margin:15px 0 8px;
}
#choices{
 display:grid;
 grid-template-columns:repeat(3,minmax(0,1fr));
 gap:10px;
 margin:20px 0;
}
.choice{
 height:115px;
 border:3px solid #80b9ff;
 border-radius:22px;
 background:linear-gradient(150deg,#398ef3,#1755b0);
 color:white;
 font-size:clamp(48px,15vw,74px);
 font-weight:900;
 box-shadow:0 6px #103b79;
 cursor:pointer;
 touch-action:manipulation;
}
.choice:active{
 transform:translateY(4px);
 box-shadow:0 2px #103b79;
}
.choice.correct{
 background:#219e50;
 border-color:#8affad;
}
.choice.wrong{
 background:#c93232;
 border-color:#ff9797;
}
button{
 border:0;
 border-radius:18px;
 padding:16px 20px;
 font-size:19px;
 font-weight:bold;
 cursor:pointer;
 color:white;
 touch-action:manipulation;
}
button:disabled{opacity:.45}
#repeat{
 background:#346cbb;
 width:100%;
 max-width:330px;
 margin:8px auto;
}
#start,#startAgain{
 background:linear-gradient(180deg,#ffbf31,#ef7920);
 color:#27251f;
 width:100%;
 max-width:330px;
 margin:12px auto;
 box-shadow:0 5px #9a4a13;
}
.settings{
 margin:18px 0 5px;
 font-size:15px;
 color:#c5d7ed;
}
select{
 background:#30496d;
 color:white;
 border:1px solid #7188aa;
 border-radius:12px;
 padding:10px;
 font-size:16px;
}
#finish{display:none;padding:20px 5px}
#finish h2{font-size:34px;color:#ffd344}
#finish p{font-size:21px}
.trophy{font-size:65px;margin:12px}
.small{color:#a9bed9;font-size:12px;margin-top:20px}
</style>
</head>
<body>
<main>
<h1>🏁 LITERKI NA PEŁNYM GAZIE!</h1>
<p class="subtitle">Wyścig po 10 literek</p>
<div class="track"></div>

<div class="hud">
 <span id="counter">🏎️ 0 / 10</span>
 <span id="mistakes">⭐ Pomyłki: 0</span>
</div>
<div class="progress"><div id="bar"></div></div>

<div class="stage">
 <div id="game">
  <img id="car" src="mater.jpg" alt="Złomek">
  <div id="message">Gotowy na wyścig?</div>
  <div id="choices"></div>

  <button id="repeat" onclick="speakQuestion()">
   🔊 POSŁUCHAJ PONOWNIE
  </button>

  <button id="start" onclick="startGame()">
   🏁 START WYŚCIGU!
  </button>

  <div class="settings">
   <label for="letterMode">Literki:</label>
   <select id="letterMode" onchange="changeMode()">
    <option value="upper">WIELKIE</option>
    <option value="lower">małe</option>
   </select>
  </div>
 </div>

 <div id="finish">
  <div class="trophy">🏆</div>
  <h2>META!</h2>
  <img src="mcqueen.jpg"
   alt="Zygzak McQueen"
   style="width:100%;height:220px;object-fit:contain">
  <p id="summary"></p>
  <button id="startAgain" onclick="startGame()">
   🏎️ NOWY WYŚCIG
  </button>
 </div>
</div>

<p class="small">Posłuchaj i wskaż właściwą literkę!</p>
</main>

<script>
// Litery w kolejności występowania w nagraniu
const alphabet=[
 ["A",0],["B",1],["C",2],
 ["D",3],["E",4],["F",5],
 ["G",6],["H",7],["I",8],
 ["J",9],["K",10],["L",11],
 ["M",12],["N",13],["O",14],
 ["P",15],["R",16],["S",17],
 ["T",18],["U",19],["W",20],
 ["Y",21],["Z",22]
];

// Przedziały czasowe w zlomek.mp3 (sekundy).
// Każdy zawiera jedną pełną wypowiedź.
const clips=[
 [0.00,1.75],
 [2.10,3.78],
 [4.15,5.84],
 [6.23,7.94],
 [8.30,9.98],
 [10.38,12.12],
 [12.47,14.16],
 [14.54,16.25],
 [16.62,18.30],
 [18.70,20.40],
 [20.75,22.40],
 [22.79,24.51],
 [24.85,26.58],
 [26.92,28.64],
 [28.99,30.64],
 [31.03,32.68],
 [33.08,34.76],
 [35.14,36.88],
 [37.22,38.85],
 [39.24,40.88],
 [41.26,42.94],
 [43.30,45.17],
 [45.48,47.18]
];

const feedback={
 correct:[47.46,48.76],
 wrong:[48.93,52.24],
 finish:[52.37,55.38]
};

const GOAL=10;

let current=null;
let completed=0;
let mistakes=0;
let playing=false;
let locked=false;
let timer=null;
let round=0;
let remaining=[];

const car=document.getElementById("car");
const message=document.getElementById("message");
const choices=document.getElementById("choices");
const repeat=document.getElementById("repeat");
const start=document.getElementById("start");
const mode=document.getElementById("letterMode");

// Jeden plik audio dla wszystkich komunikatów
const audio=new Audio("zlomek.mp3");
audio.preload="auto";

let clipInterval=null;
let clipEnd=0;

repeat.disabled=true;

function stopAudio(){
 if(clipInterval!==null){
  clearInterval(clipInterval);
  clipInterval=null;
 }
 audio.pause();
}

function playClip(startTime,endTime){
 stopAudio();

 clipEnd=endTime;
 audio.currentTime=startTime;

 const promise=audio.play();

 if(promise && promise.catch){
  promise.catch(err=>{
   console.warn("Nie udało się odtworzyć:",err);
   if(playing && !locked){
    message.textContent=
     "Dotknij 🔊, aby usłyszeć Złomka!";
   }
  });
 }

 // Pilnujemy końca wybranego fragmentu.
 clipInterval=setInterval(()=>{
  if(audio.currentTime>=clipEnd){
   stopAudio();
  }
 },25);
}

function shuffle(a){
 const result=[...a];
 for(let i=result.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [result[i],result[j]]=[result[j],result[i]];
 }
 return result;
}

function updateHud(){
 document.getElementById("counter").textContent=
  "🏎️ "+completed+" / "+GOAL;

 document.getElementById("mistakes").textContent=
  "⭐ Pomyłki: "+mistakes;

 document.getElementById("bar").style.width=
  (completed/GOAL*100)+"%";
}

function startGame(){
 clearTimeout(timer);
 stopAudio();

 completed=0;
 mistakes=0;
 current=null;
 remaining=shuffle(alphabet);
 playing=true;
 locked=false;

 document.getElementById("finish").style.display="none";
 document.getElementById("game").style.display="block";

 start.style.display="none";
 repeat.disabled=false;

 updateHud();
 nextRound();
}

function changeMode(){
 if(playing && !locked){
  renderChoices();
  speakQuestion();
 }
}

function nextRound(){
 clearTimeout(timer);
 stopAudio();

 if(!playing)return;

 if(completed>=GOAL){
  finishGame();
  return;
 }

 round++;
 locked=false;
 repeat.disabled=false;
 car.src="mater.jpg";
 message.textContent="Posłuchaj Złomka!";

 if(remaining.length===0){
  remaining=shuffle(alphabet);
 }

 current=remaining.pop();
 renderChoices();

 // Odtwarzamy od razu, aby działało także
 // po naciśnięciu START na Androidzie.
 speakQuestion();
}

function renderChoices(){
 choices.innerHTML="";
 if(!current)return;

 const others=shuffle(
  alphabet.filter(x=>x[0]!==current[0])
 ).slice(0,2);

 const options=shuffle([current,...others]);

 options.forEach(item=>{
  const b=document.createElement("button");
  b.className="choice";
  b.textContent=mode.value==="upper"
   ?item[0]:item[0].toLowerCase();

  b.setAttribute("aria-label","Litera "+item[0]);
  b.onclick=()=>checkAnswer(item,b);
  choices.appendChild(b);
 });
}

function speakQuestion(){
 if(!playing || locked || !current)return;

 const segment=clips[current[1]];
 message.textContent="🔊 Znajdź właściwą literkę!";
 playClip(segment[0],segment[1]);
}

function checkAnswer(item,button){
 if(!playing || locked)return;

 if(item[0]===current[0]){
  correctAnswer(button);
 }else{
  wrongAnswer(button);
 }
}

function correctAnswer(button){
 locked=true;
 repeat.disabled=true;
 clearTimeout(timer);

 button.classList.add("correct");
 completed++;
 updateHud();

 car.src="mcqueen.jpg";
 message.textContent="🏆 Dajesz czadu!";

 playClip(feedback.correct[0],feedback.correct[1]);

 const id=round;
 timer=setTimeout(()=>{
  if(id===round && playing){
   if(completed>=GOAL)finishGame();
   else nextRound();
  }
 },2300);
}

function wrongAnswer(button){
 locked=true;
 repeat.disabled=true;
 clearTimeout(timer);

 mistakes++;
 updateHud();

 button.classList.add("wrong");
 car.src="mater.jpg";
 message.textContent="Siwy dym, pomyłka!";

 playClip(feedback.wrong[0],feedback.wrong[1]);

 const id=round;
 timer=setTimeout(()=>{
  if(id!==round || !playing)return;

  button.classList.remove("wrong");
  message.textContent="Spróbuj jeszcze raz!";
  locked=false;
  repeat.disabled=false;
 },3500);
}

function finishGame(){
 if(!playing)return;

 clearTimeout(timer);
 stopAudio();

 playing=false;
 locked=true;

 document.getElementById("game").style.display="none";
 document.getElementById("finish").style.display="block";

 document.getElementById("summary").textContent=
  "Brawo! Rozpoznano 10 literek! Pomyłki: "+mistakes;

 playClip(feedback.finish[0],feedback.finish[1]);
}
</script>
</body>
</html>
