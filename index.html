
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#091426">
<title>Literki na pełnym gazie 8.0</title>
<style>
:root{
 --navy:#091426;
 --panel:#172b49;
 --blue:#52b6ff;
 --yellow:#ffcf48;
 --white:#f6f9ff;
}
*{box-sizing:border-box}
body{
 margin:0;
 min-height:100vh;
 font-family:system-ui,Arial,sans-serif;
 color:var(--white);
 text-align:center;
 background:
  radial-gradient(circle at 50% -10%,#27578a 0%,transparent 55%),
  linear-gradient(160deg,#101f39,#080f20);
}
main{
 max-width:560px;
 margin:auto;
 padding:18px 15px 40px;
}
.logo{
 font-size:13px;
 letter-spacing:3px;
 color:#82d6ff;
 font-weight:900;
 margin:10px 0 6px;
}
h1{
 font-size:clamp(27px,7vw,38px);
 line-height:1.1;
 color:var(--yellow);
 margin:6px 0 10px;
 text-shadow:0 4px 20px #0007;
}
.subtitle{
 color:#b9cee7;
 font-size:14px;
 margin-bottom:20px;
}
.hud{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px;
 margin-bottom:12px;
}
.stat{
 background:#1a3152;
 border:1px solid #355a80;
 border-radius:17px;
 padding:11px 8px;
 box-shadow:0 5px 15px #0002;
}
.stat small{
 display:block;
 color:#b8cbe3;
 font-size:11px;
 text-transform:uppercase;
 letter-spacing:1px;
 margin-bottom:5px;
}
.stat strong{
 font-size:21px;
 font-weight:900;
}
.progress{
 height:15px;
 background:#203550;
 border-radius:30px;
 overflow:hidden;
 margin:14px 0 21px;
 border:1px solid #446180;
}
#bar{
 width:0%;
 height:100%;
 border-radius:30px;
 background:linear-gradient(90deg,#ff9d38,#ffe16b);
 box-shadow:0 0 15px #ffcb52;
 transition:width .5s ease;
}
.stage{
 background:linear-gradient(165deg,#203b5e,#11243e);
 border:1px solid #49749e;
 border-radius:29px;
 padding:15px 14px 24px;
 box-shadow:
  0 20px 45px #0006,
  inset 0 1px #ffffff24;
}
.car-area{
 position:relative;
 height:225px;
 width:100%;
 border-radius:21px;
 overflow:hidden;
 background:
  radial-gradient(ellipse at center,#395c83,#152943);
 border:1px solid #6485a755;
}
#car{
 display:block;
 width:100%;
 height:100%;
 object-fit:contain;
}
#message{
 min-height:66px;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:clamp(19px,5vw,25px);
 line-height:1.25;
 font-weight:900;
 color:#ffdc66;
 padding:12px 4px 2px;
 text-shadow:0 2px 6px #0005;
}
#choices{
 display:grid;
 grid-template-columns:repeat(3,minmax(0,1fr));
 gap:11px;
 margin:18px 0 20px;
}
.choice{
 height:112px;
 border:2px solid #79c6ff;
 border-radius:24px;
 background:linear-gradient(155deg,#399ff4,#1653a6);
 color:#fff;
 font-size:clamp(50px,15vw,75px);
 font-weight:1000;
 box-shadow:0 7px #0b376c,0 12px 20px #0003;
 text-shadow:0 3px 7px #0004;
 cursor:pointer;
 transition:transform .12s,background .2s;
 touch-action:manipulation;
}
.choice:active{
 transform:translateY(5px) scale(.96);
 box-shadow:0 2px #0b376c;
}
.choice.correct{
 background:linear-gradient(150deg,#37ce76,#148746);
 border-color:#a0ffbe;
}
.choice.wrong{
 background:linear-gradient(150deg,#f76a65,#ae2637);
 border-color:#ffb1b1;
}
button{
 border:0;
 border-radius:18px;
 padding:16px 18px;
 font-size:17px;
 font-weight:900;
 color:#fff;
 cursor:pointer;
 touch-action:manipulation;
}
button:disabled{opacity:.5}
#repeat{
 display:block;
 width:100%;
 background:#304e77;
 border:1px solid #5d86b7;
 box-shadow:0 4px #1a304f;
}
#start,#startAgain{
 display:block;
 width:100%;
 margin:16px auto 0;
 background:linear-gradient(180deg,#ffe171,#f6a82d);
 color:#2c2618;
 box-shadow:0 5px #a7641d;
}
.settings{
 display:flex;
 align-items:center;
 justify-content:center;
 gap:10px;
 margin-top:23px;
 color:#c6d8ef;
 font-size:14px;
}
select{
 background:#29466a;
 color:white;
 border:1px solid #6689ad;
 border-radius:13px;
 padding:10px;
 font-size:16px;
}
.small{
 font-size:12px;
 color:#8fa8c7;
 margin-top:18px;
}
#finish{
 display:none;
 position:relative;
 overflow:hidden;
 padding:15px 4px;
}
#finish h2{
 font-size:38px;
 color:var(--yellow);
 margin:6px;
}
#finish p{font-size:20px;line-height:1.5}
#finish img{
 width:100%;
 height:220px;
 object-fit:contain;
 border-radius:18px;
}
.trophy{
 font-size:72px;
 animation:trophy 1.1s ease-in-out infinite alternate;
}
@keyframes trophy{
 to{transform:translateY(-10px) rotate(6deg)}
}

/* Błąd: Złomek drży i dymi */
.car-area.shake #car{
 animation:shake .13s linear 12;
}
@keyframes shake{
 0%,100%{transform:translateX(0)}
 25%{transform:translate(-4px,2px) rotate(-1deg)}
 75%{transform:translate(4px,-2px) rotate(1deg)}
}
#smoke{
 display:none;
 position:absolute;
 left:50%;
 top:49%;
 pointer-events:none;
}
.car-area.smoking #smoke{display:block}
.puff{
 position:absolute;
 width:38px;
 height:38px;
 border-radius:50%;
 opacity:0;
 background:radial-gradient(circle at 35% 30%,
 #f0f1f2e8,#9ba3b3c9 50%,#505c7000 78%);
 animation:smoke 1.55s ease-out infinite;
}
.puff:nth-child(1){left:-18px;animation-delay:0s}
.puff:nth-child(2){left:8px;animation-delay:.3s}
.puff:nth-child(3){left:-29px;animation-delay:.6s}
.puff:nth-child(4){left:14px;animation-delay:.9s}
.puff:nth-child(5){left:-4px;animation-delay:1.2s}
@keyframes smoke{
 0%{transform:translateY(12px) scale(.3);opacity:0}
 20%{opacity:.95}
 100%{
  transform:translate(-30px,-110px) scale(2.4);
  opacity:0;
 }
}

/* Sukces: indywidualne ruchy aut */
.car-area.turbo #car{
 animation:turbo 1.6s cubic-bezier(.2,.7,.3,1) both;
}
@keyframes turbo{
 0%{transform:translateX(-120%) scale(.8);opacity:0}
 55%{transform:translateX(10%) scale(1.08);opacity:1}
 75%{transform:translateX(-5%)}
 100%{transform:translateX(0) scale(1);opacity:1}
}
.car-area.bounce #car{
 animation:bounce 1.7s ease-in-out both;
}
@keyframes bounce{
 0%,100%{transform:translateY(0) rotate(0)}
 25%{transform:translateY(-25px) rotate(-5deg)}
 45%{transform:translateY(0) rotate(3deg)}
 70%{transform:translateY(-16px) rotate(4deg)}
}
.car-area.drift #car{
 animation:drift 1.8s ease-out both;
}
@keyframes drift{
 0%{transform:translateX(115%) rotate(12deg);opacity:0}
 50%{transform:translateX(-12%) rotate(-8deg);opacity:1}
 75%{transform:translateX(5%) rotate(4deg)}
 100%{transform:translateX(0) rotate(0);opacity:1}
}
.car-area.jump #car{
 animation:jump 1.9s ease-in-out both;
}
@keyframes jump{
 0%{transform:translateY(100%) scale(.85);opacity:0}
 35%{transform:translateY(-37px) rotate(-7deg);opacity:1}
 60%{transform:translateY(-45px) rotate(5deg)}
 80%{transform:translateY(7px)}
 100%{transform:translateY(0) rotate(0);opacity:1}
}

/* Gwiazdki */
#stars{
 display:none;
 position:absolute;
 inset:0;
 pointer-events:none;
}
.car-area.success #stars{display:block}
.star{
 position:absolute;
 font-size:32px;
 animation:star 1.5s ease-out both;
}
.star:nth-child(1){top:8%;left:10%;animation-delay:.1s}
.star:nth-child(2){top:10%;right:10%;animation-delay:.3s}
.star:nth-child(3){bottom:12%;left:13%;animation-delay:.5s}
.star:nth-child(4){bottom:15%;right:12%;animation-delay:.7s}
.star:nth-child(5){top:0;left:45%;animation-delay:.4s}
@keyframes star{
 0%{transform:scale(0) rotate(-90deg);opacity:0}
 40%{transform:scale(1.5) rotate(20deg);opacity:1}
 100%{transform:scale(.8) rotate(80deg);opacity:0}
}

/* Konfetti */
#confetti{
 position:absolute;
 inset:0;
 overflow:hidden;
 pointer-events:none;
}
.confetti-piece{
 position:absolute;
 top:-25px;
 width:10px;
 height:18px;
 animation:fall 3s linear forwards;
}
@keyframes fall{
 to{transform:translateY(550px) rotate(720deg);opacity:0}
}
@media(prefers-reduced-motion:reduce){
 .car-area #car,.puff,.star,.trophy,.confetti-piece{
  animation:none!important;
 }
}
</style>
</head>
<body>
<main>
 <div class="logo">🏁 WYŚCIGOWA AKADEMIA</div>
 <h1>LITERKI NA<br>PEŁNYM GAZIE!</h1>
 <p class="subtitle">10 literek do wielkiego zwycięstwa</p>

 <div class="hud">
  <div class="stat">
   <small>Postęp wyścigu</small>
   <strong id="counter">🏎️ 0 / 10</strong>
  </div>
  <div class="stat">
   <small>Pomyłki</small>
   <strong id="mistakes">⭐ 0</strong>
  </div>
 </div>

 <div class="progress"><div id="bar"></div></div>

 <div class="stage">
  <div id="game">
   <div class="car-area" id="carArea">
    <img id="car" src="mater.jpg" alt="Złomek">
    <div id="smoke">
     <span class="puff"></span>
     <span class="puff"></span>
     <span class="puff"></span>
     <span class="puff"></span>
     <span class="puff"></span>
    </div>
    <div id="stars">
     <span class="star">⭐</span>
     <span class="star">✨</span>
     <span class="star">🌟</span>
     <span class="star">⭐</span>
     <span class="star">✨</span>
    </div>
   </div>

   <div id="message">Gotowy na wyścig?</div>
   <div id="choices"></div>

   <button id="repeat" onclick="speakQuestion()">
    🔊 POSŁUCHAJ PONOWNIE
   </button>
   <button id="start" onclick="startGame()">
    🏁 START WYŚCIGU!
   </button>

   <div class="settings">
    <label for="letterMode">Wybierz literki:</label>
    <select id="letterMode" onchange="changeMode()">
     <option value="upper">WIELKIE</option>
     <option value="lower">małe</option>
    </select>
   </div>
  </div>

  <div id="finish">
   <div id="confetti"></div>
   <div class="trophy">🏆</div>
   <h2>WIELKA META!</h2>
   <img src="mcqueen.jpg" alt="Zygzak">
   <p id="summary"></p>
   <button id="startAgain" onclick="startGame()">
    🏎️ NOWY WYŚCIG
   </button>
  </div>
 </div>

 <p class="small">Słuchaj, wybieraj literki i zdobywaj zwycięstwa!</p>
</main>

<script>
const alphabet=[
 ["A",0],["B",1],["C",2],["D",3],
 ["E",4],["F",5],["G",6],["H",7],
 ["I",8],["J",9],["K",10],["L",11],
 ["M",12],["N",13],["O",14],["P",15],
 ["R",16],["S",17],["T",18],["U",19],
 ["W",20],["Y",21],["Z",22]
];

const letterClips=[
 [0,1.75],[2.10,3.78],[4.15,5.84],
 [6.23,7.94],[8.30,9.98],[10.38,12.12],
 [12.47,14.16],[14.54,16.25],[16.62,18.30],
 [18.70,20.40],[20.75,22.40],[22.79,24.51],
 [24.85,26.58],[26.92,28.64],[28.99,30.64],
 [31.03,32.68],[33.08,34.76],[35.14,36.88],
 [37.22,38.85],[39.24,40.88],[41.26,42.94],
 [43.30,45.17],[45.48,47.18]
];

const feedback={
 wrong:[48.93,52.24],
 finish:[52.37,55.38]
};

// Poprawione granice pochwaly.mp3
const praiseClips=[
 [0.00,2.19],
 [2.19,4.28],
 [4.28,7.15],
 [7.15,9.92],
 [9.92,12.56],
 [12.56,14.85],
 [14.85,17.57],
 [17.57,20.99],
 [20.99,23.45],
 [23.45,26.29],
 [26.29,29.72],
 [29.72,32.13]
];

const praiseTexts=[
 "Dajesz czadu, młody kierowco!",
 "Ale masz turbo w głowie!",
 "No i pięknie! Gaz do dechy!",
 "Łooo! Ale z ciebie bystrzak!",
 "Trafione! Prosto w dziesiątkę!",
 "Tak trzymaj, mistrzu kierownicy!",
 "O rety! Ale szybka odpowiedź!",
 "Brawo! Silnik aż mruczy z radości!",
 "Ha ha! Aleś ty sprytny!",
 "Świetnie! Kolejna literka za nami!",
 "No proszę! Prawdziwy mistrz wyścigów!",
 "Juhu! Jedziemy dalej!"
];

const cars=[
 {file:"czerwony.jpg",anim:"turbo",name:"Czerwony wyścigowiec"},
 {file:"holownik.jpg",anim:"bounce",name:"Wesoły holownik"},
 {file:"niebieski.jpg",anim:"drift",name:"Niebieska wyścigówka"},
 {file:"zolty.jpg",anim:"jump",name:"Żółty terenowiec"}
];

const GOAL=10;
let current=null;
let completed=0;
let mistakes=0;
let playing=false;
let locked=false;
let round=0;
let timer=null;
let remaining=[];
let praiseBag=[];
let carBag=[];

const car=document.getElementById("car");
const carArea=document.getElementById("carArea");
const message=document.getElementById("message");
const choices=document.getElementById("choices");
const repeat=document.getElementById("repeat");
const start=document.getElementById("start");
const mode=document.getElementById("letterMode");

const questionAudio=new Audio("zlomek.mp3");
const praiseAudio=new Audio("pochwaly.mp3");
questionAudio.preload="auto";
praiseAudio.preload="auto";

let audioToken=0;
let activeAudio=null;
let audioWatcher=null;
let activeEnd=0;

repeat.disabled=true;

function shuffle(items){
 const a=[...items];
 for(let i=a.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [a[i],a[j]]=[a[j],a[i]];
 }
 return a;
}

function stopAudio(){
 audioToken++;
 if(audioWatcher!==null){
  clearInterval(audioWatcher);
  audioWatcher=null;
 }
 questionAudio.pause();
 praiseAudio.pause();
 activeAudio=null;
}

function playClip(audio,from,to,onComplete){
 stopAudio();
 const token=audioToken;
 activeAudio=audio;
 activeEnd=to;

 let completedClip=false;

 function finishClip(){
  if(completedClip||token!==audioToken)return;
  completedClip=true;
  if(audioWatcher!==null){
   clearInterval(audioWatcher);
   audioWatcher=null;
  }
  audio.pause();
  activeAudio=null;
  if(onComplete)onComplete();
 }

 async function begin(){
  if(token!==audioToken)return;
  try{
   if(audio.readyState<1){
    await new Promise((resolve,reject)=>{
     const loaded=()=>{
      cleanup();
      resolve();
     };
     const failed=()=>{
      cleanup();
      reject(new Error("Nie można wczytać MP3"));
     };
     const cleanup=()=>{
      audio.removeEventListener("loadedmetadata",loaded);
      audio.removeEventListener("error",failed);
     };
     audio.addEventListener("loadedmetadata",loaded);
     audio.addEventListener("error",failed);
     audio.load();
    });
   }

   if(token!==audioToken)return;

   // Seek do początku wybranej wypowiedzi.
   audio.currentTime=from;
   await audio.play();

   if(token!==audioToken){
    audio.pause();
    return;
   }

   audioWatcher=setInterval(()=>{
    if(token!==audioToken)return;
    if(audio.currentTime>=activeEnd-0.015||
       audio.ended){
     finishClip();
    }
   },20);

  }catch(err){
   if(token!==audioToken)return;
   console.warn("Problem z nagraniem:",err);
   finishClip();
  }
 }

 begin();
}

function updateHud(){
 document.getElementById("counter").textContent=
  "🏎️ "+completed+" / "+GOAL;
 document.getElementById("mistakes").textContent=
  "⭐ "+mistakes;
 document.getElementById("bar").style.width=
  (completed/GOAL*100)+"%";
}

function resetAnimation(){
 carArea.className="car-area";
 void carArea.offsetWidth;
}

function nextPraise(){
 if(!praiseBag.length){
  praiseBag=shuffle(praiseClips.map((_,i)=>i));
 }
 return praiseBag.pop();
}

function nextCar(){
 if(!carBag.length){
  carBag=shuffle(cars);
 }
 return carBag.pop();
}

function startGame(){
 clearTimeout(timer);
 stopAudio();
 resetAnimation();

 completed=0;
 mistakes=0;
 current=null;
 round++;
 remaining=shuffle(alphabet);
 praiseBag=shuffle(praiseClips.map((_,i)=>i));
 carBag=shuffle(cars);
 playing=true;
 locked=false;

 document.getElementById("finish").style.display="none";
 document.getElementById("game").style.display="block";
 document.getElementById("confetti").innerHTML="";
 start.style.display="none";

 updateHud();
 nextRound();
}

function changeMode(){
 if(playing&&!locked){
  renderChoices();
 }
}

function nextRound(){
 clearTimeout(timer);
 stopAudio();
 resetAnimation();

 if(!playing)return;
 if(completed>=GOAL){
  finishGame();
  return;
 }

 round++;
 locked=false;
 repeat.disabled=false;
 car.src="mater.jpg";
 car.alt="Złomek";

 if(!remaining.length){
  remaining=shuffle(alphabet);
 }
 current=remaining.pop();

 renderChoices();
 speakQuestion();
}

function renderChoices(){
 choices.innerHTML="";
 if(!current)return;

 const others=shuffle(
  alphabet.filter(x=>x[0]!==current[0])
 ).slice(0,2);
 const options=shuffle([current,...others]);

 for(const item of options){
  const button=document.createElement("button");
  button.className="choice";
  button.textContent=mode.value==="upper"
   ?item[0]:item[0].toLowerCase();
  button.setAttribute("aria-label","Litera "+item[0]);
  button.onclick=()=>checkAnswer(item,button);
  choices.appendChild(button);
 }
}

function speakQuestion(){
 if(!playing||locked||!current)return;
 const clip=letterClips[current[1]];
 message.textContent="🔊 Znajdź właściwą literkę!";
 playClip(questionAudio,clip[0],clip[1]);
}

function checkAnswer(item,button){
 if(!playing||locked)return;
 if(item[0]===current[0]){
  correctAnswer(button);
 }else{
  wrongAnswer(button);
 }
}

function correctAnswer(button){
 locked=true;
 repeat.disabled=true;
 clearTimeout(timer);
 resetAnimation();

 button.classList.add("correct");
 completed++;
 updateHud();

 const chosenCar=nextCar();
 const index=nextPraise();
 const clip=praiseClips[index];

 car.src=chosenCar.file;
 car.alt=chosenCar.name;
 carArea.classList.add("success",chosenCar.anim);
 message.textContent="🏆 "+praiseTexts[index];

 const thisRound=round;

 // Przejście dopiero po zakończeniu nagrania.
 playClip(praiseAudio,clip[0],clip[1],()=>{
  if(!playing||thisRound!==round)return;
  timer=setTimeout(()=>{
   if(!playing||thisRound!==round)return;
   if(completed>=GOAL){
    finishGame();
   }else{
    nextRound();
   }
  },650);
 });
}

function wrongAnswer(button){
 locked=true;
 repeat.disabled=true;
 clearTimeout(timer);
 resetAnimation();

 mistakes++;
 updateHud();
 button.classList.add("wrong");
 car.src="mater.jpg";
 car.alt="Złomek";
 carArea.classList.add("shake","smoking");
 message.textContent="💨 Siwy dym, pomyłka!";

 const thisRound=round;
 const clip=feedback.wrong;

 playClip(questionAudio,clip[0],clip[1],()=>{
  if(!playing||thisRound!==round)return;
  timer=setTimeout(()=>{
   if(!playing||thisRound!==round)return;
   resetAnimation();
   button.classList.remove("wrong");
   message.textContent="Spróbuj jeszcze raz!";
   locked=false;
   repeat.disabled=false;
  },300);
 });
}

function makeConfetti(){
 const box=document.getElementById("confetti");
 box.innerHTML="";
 const colors=[
  "#ffce49","#ff6767","#48c8ff",
  "#85f7a4","#e8a4ff","#fff"
 ];
 for(let i=0;i<50;i++){
  const p=document.createElement("span");
  p.className="confetti-piece";
  p.style.left=Math.random()*100+"%";
  p.style.background=
   colors[Math.floor(Math.random()*colors.length)];
  p.style.animationDelay=Math.random()*1.2+"s";
  p.style.animationDuration=2+Math.random()*2+"s";
  box.appendChild(p);
 }
}

function finishGame(){
 if(!playing)return;
 clearTimeout(timer);
 stopAudio();
 resetAnimation();

 playing=false;
 locked=true;
 document.getElementById("game").style.display="none";
 document.getElementById("finish").style.display="block";
 document.getElementById("summary").textContent=
  "Brawo, mistrzu! Rozpoznano 10 literek."+
  " Pomyłki: "+mistakes;

 makeConfetti();
 const clip=feedback.finish;
 playClip(questionAudio,clip[0],clip[1]);
}
</script>
</body>
</html>
